<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mortgage Repayment Calculator</title>
  <link rel="stylesheet" href="index.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Edu+AU+VIC+WA+NT+Guides:wght@400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
</head>
<body>
  <main>
    <form id="mortgage-calculator" class="left">
      <nav >
        <h2>Mortgage Calculator</h2>
        <p>Clear All</p>
      </nav>
      <div class="calculation-container">
        <label for="amount">Mortgage Amount</label>
        <div class="amount-input">
          <span>$</span>
          <input id="amount" type="text">
        </div>
        <p class="amount-error mssg">The field is required</p>

        <div class="term-rate">
          <div class="term">
            <label for="terms">Mortgage Term</label>
            <div class="amount-term">
              <input id="years" type="text">
              <span>years</span>
            </div>
            <p class="term-error mssg">The field is required</p>
          </div>
          <div class="rate">
            <label for="interest-rate">Interest Rate</label>
            <div class="interest-rate">
              <input id="percentage" type="text">
              <span>%</span>
            </div>
            <p class="rate-error mssg">The field is required</p>
          </div>
        </div>

        <div class="payment-type">
          <label class="mortgage-type">Mortgage Type</label>
          <div class="repayment">
            <input type="radio" id="repayment" name="type" value="repayment">
            <label>Repayment</label>
          </div>
          <div class="interest">
            <input type="radio" id="interest-only" name="type" value="interest-only">
            <label>Interest Only</label>
          </div>
          <p class="type-error mssg">The field is required</p>
        </div>
      </div>

      <button class="submit" form="mortgage-calculator" type="submit">
        <img src="../images/icon-calculator-mortgage.svg" alt="calculator-img">
        <p>Calculate Repayments</p>
      </button>
    </form>

    <section class="right">
      <div class="image-container">
        <img src="../images/illustration-empty.svg" class="illustration" alt="illustration">
      </div>
      <h4>Result Shown here</h4>
      <p>
        Complete the form and click 'Calculate Repayments' to see what your monthly repayment would be
      </p>
    </section>
  </main>
  
  <script src="index.js"></script>
</body>
</html>
