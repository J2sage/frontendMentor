<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dessert Cart</title>
  <link rel="icon" type="image" href="images/favicon-32x32.png" sizes="32x32">
	<link rel="stylesheet" href="index.css">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Text:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
</head>
<body>
  <main>
		<section class="dessert-container">
			<h1 class="title">Desserts</h1>
			<div class="choice-grid">
				
			</div>
		</section>
		<section class="cart-list-container">
			<h1 class="cart-quantity">Your Cart(0)</h1>
			<div class="empty">
				<img src="images/illustration-empty-cart.svg" alt="empty-cart-illustration">
				<p class="text">Your added item will appear here</p>
			</div>
			<div class="cart-list">
				
			</div>
			<div class="calculate-total">
        <div class="total-container">
					<p class="total-text">Order Total</p>
        	<p class="total-price">$0.00</p>
				</div>
				<div class="note">
					<img src="images/icon-carbon-neutral.svg" alt="carbon-neutral-icon">
					<p class="note-text">This is a <b>carbon-neutral</b> delivery</p>
				</div>
				<button class="checkout-btn">Confirm Order</button>
      </div>
		</section>
  </main>
	<section class="overlay-container">
		<article class="overlay">
			<img src="images/icon-order-confirmed.svg" class="overlay-icon" alt="order-confirmed-icon">
			<h1 class="overlay-title">Order Confirmed</h1>
			<p class="overlay-text">We hope you enjoy your food!</p>
			<div class="order">
				
			</div>
			<div class="order-total">
				<p class="total-text">Order Total</p>
				<p class="total-order-price">$0.00</p>
			</div>
			<p class="new">Start New Order</p>
		</article>
	</section>
	

	<script type="module" src="script/index.js"></script>
</body>
</html>
