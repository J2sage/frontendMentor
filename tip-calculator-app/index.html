<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tip-Calculator</title>
  <link rel="stylesheet" href="index.css"><link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Edu+AU+VIC+WA+NT+Guides:wght@400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
</head>
<body>

  <img src="img/logo.svg" class="logo" alt="">

  <main>
    <section class="input-part">
      <div class="bill-input-container">
        <label for="bill-amount" class="bill">Bill</label>
        <div class="input-box">
          <img src="img/icon-dollar.svg" alt="dollar-sign">
          <input type="text" placeholder="0" id="bill-amount">
        </div>
      </div>

      <div class="tip-choice">
        <p class="selection">Select Tip %</p>

        <div class="tip-grid">
          <p class="five" id="percentage">5%</p>
          <p class="ten" id="percentage">10%</p>
          <p class="fifteen" id="percentage">15%</p>
          <p class="two-five" id="percentage">25%</p>
          <p class="fifty" id="percentage">50%</p>
          <input type="text" class="custom" id="custom" placeholder="Custom">
        </div>
      </div>

      <div class="people">
        <div class="people-header">
          <label for="number" class="no">Number of people</label>
          <p class="error">Can't be zero</p>
        </div>

        <div class="people-input">
          <img src="img/icon-person.svg" alt="person-icon">
          <input type="text" placeholder="0" id="number">
        </div>
      </div>
    </section>

    <section class="result-part">
      <div class="top">
        <div class="amount-container">
          <div class="left">
            <p class="amount">Tip Amount</p>
            <p class="person">/ person</p>
          </div>
          <div class="right">
            <span>$</span>
            <h1 id="total-tip-figure">0.00</h1>
          </div>
        </div>

        <div class="amount-container">
          <div class="left">
            <p class="amount">Total</p>
            <p class="person">/ person</p>
          </div>
          <div class="right">
            <span>$</span>
            <h1 id="total-figure">0.00</h1>
          </div>
        </div>
      </div>
      <div class="bottom">
        <button id="reset-button">RESET</button>
      </div>
    </section>
  </main>

  <script src="index.js"></script>
</body>
</html>
